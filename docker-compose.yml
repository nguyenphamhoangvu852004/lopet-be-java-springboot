networks:
  lopet-network:

services:
  mysql:
    image: mysql:8.4
    container_name: ${DATABASE_HOSTNAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    ports:
      - 3307:3306
    volumes:
      - lopet-mysql-volume:/var/lib/mysql
    networks:
      - lopet-network
    mem_limit: 600m


  redis:
    image: redis:8.0
    container_name: ${REDIS_HOSTNAME}
    ports:
      - 6379:6379
    networks:
      - lopet-network
    mem_limit: 100m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    ports:
      # Hai cổng, không phải một: Tomcat phục vụ REST ở 8080, còn netty-socketio nghe cổng RIÊNG
      # (8081) vì Tomcat đã chiếm 8080 — xem lopet.socket.port trong application.yml. Thiếu dòng
      # thứ hai thì REST chạy bình thường trong khi mọi kết nối socket của frontend bị từ chối, một
      # kiểu hỏng chỉ lộ ra ở tính năng realtime.
      #
      # Bản deploy sau nginx gộp cả hai về một origin và chỉ publish một cổng; compose này KHÔNG
      # chạy nginx (Dockerfile vào thẳng `java -jar`), nên phải mở đúng cổng mà client gọi tới.
      - 8080:8080
      - 8081:8081
    env_file:
      - .env.dev
    networks:
      - lopet-network

    mem_limit: 1200m

    depends_on:
      - mysql
      - redis
volumes:
  lopet-mysql-volume:



