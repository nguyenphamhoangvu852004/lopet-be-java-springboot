networks:
  lopet-network:

services:
  mysql:
    image: mysql:8.4
    container_name: ${DATABASE_HOSTNAME}
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
    volumes:
      - lopet-mysql-volume:/var/lib/mysql
    networks:
      - lopet-network
    mem_limit: 600m


  redis:
    image: redis:8.0
    container_name: ${REDIS_HOSTNAME}
    networks:
      - lopet-network
    mem_limit: 100m

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - .env.prod
    networks:
      - lopet-network

    mem_limit: 1200m

    depends_on:
      - mysql
      - redis
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    depends_on:
      - backend
    networks:
      - lopet-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot

volumes:
  lopet-mysql-volume:
  certbot-etc:
  certbot-www:



