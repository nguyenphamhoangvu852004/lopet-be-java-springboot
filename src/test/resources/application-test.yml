# Values for @ActiveProfiles("test"). It exists so the tests do NOT depend on a dev machine's .env:
# application.yml only declares ${VAR} without defaults, so without this file the test context breaks on CI.
# Everything here is fake — the real secrets live only in .env.
server:
  port: 0

spring:
  jpa:
    hibernate:
      # Set explicitly rather than inherited from application.yml: each test class uses an empty
      # database (createDatabaseIfNotExist=true), so without schema generation every integration test breaks.
      ddl-auto: update

  # spring.datasource.url is overridden per test class through @DynamicPropertySource
  # (see IntegrationTestBase.jdbcUrl) so each suite gets its own database.
  datasource:
    url: jdbc:mysql://127.0.0.1:3307/lopet_java_test?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true
    username: root
    password: nguyenvu

  # `url` MUST be present: application.yml declares `spring.data.redis.url: ${REDIS_URL}`, and with no
  # .env file the literal string `${REDIS_URL}` reaches Lettuce -> "Invalid Redis URL", breaking the
  # context of EVERY integration test. Declaring host/port alone is not enough because `url` wins.
  #
  # DATABASE 1, NOT 0: the dev application runs against the same Redis and uses db 0. The test database
  # is rebuilt from the entities, so ids restart at 1 and immediately collide with dev ids. It shows up
  # as a red test saying "expected: 4 but was: 2", with no code in this repo actually at fault.
  data:
    redis:
      url: redis://localhost:6379/1
      host: localhost
      port: 6379
      database: 1

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

lopet:
  jwt:
    access-token-secret: test-access-secret-23by
    refresh-token-secret: test-refresh-secret-24by
    access-token-expires-in: 3600
    refresh-token-expires-in: 36000

  cors:
    allowed-origins: '*'

  cloudinary:
    cloud-name: test-cloud
    api-key: test-key
    api-secret: test-secret

  mail:
    from: Lopet Test <test@lopet.local>
    admin-receiver: admin@lopet.local
    resend:
      # Fake key: tests must not reach the real Resend. The Resend bean only holds this string and
      # makes no network call on creation, so the context still comes up fine.
      api-key: re_test_fake_key

  # Leaving these three blank is deliberate: AdminInitializer skips when the config is empty, so the
  # tests do not create an admin account in the test database.
  admin:
    email: ''
    username: ''
    password: ''

logging:
  level:
    root: warn
    com.nguyenvu.lopet: warn
