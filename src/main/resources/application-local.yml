server:
  port: ${APP_PORT}

spring:
  # Nạp .env ở thư mục chạy app theo định dạng properties. `optional:` để app vẫn khởi động
  # được khi biến môi trường đã được cung cấp từ bên ngoài (docker, CI) mà không có file .env.
  config:
    import: optional:file:.env[.properties]

  application:
    name: lopet

  # MYSQL on RAILWAY
  datasource:
    url: jdbc:mysql://${DATABASE_HOSTNAME}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 32
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false


  data:
    redis:
      host: ${REDIS_HOSTNAME}
      port: ${REDIS_PORT}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER}
    password: ${MAIL_PASS}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

lopet:
  jwt:
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    access-token-expires-in: ${ACCESS_TOKEN_EXPIRES_IN}
    refresh-token-expires-in: ${REFRESH_TOKEN_EXPIRES_IN}

  cors:
    allowed-origins: ${DOMAIN_CORS}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  mail:
    admin-receiver: ${MAIL_ADMIN_RECEIVER}

  admin:
    email: ${INIT_ADMIN_EMAIL}
    username: ${INIT_ADMIN_USERNAME}
    password: ${INIT_ADMIN_PASSWORD}

  socket:
    hostname: ${SOCKET_HOSTNAME}
    port: ${SOCKET_PORT}

logging:
  level:
    root: ${LOG_LEVEL}
    com.nguyenvu.lopet: ${LOG_LEVEL}
