spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: false
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        max-tokens: ${ANTHROPIC_MAX_TOKENS}
        model: ${ANTHROPIC_MODEL}


lopet:
  bootstrap:
    seed-demo: ${SEED_DEMO:true}