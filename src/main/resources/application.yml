# Tên biến môi trường giữ trùng với example.env của lopet-be để file .env đang chạy dùng lại được.
server:
  # Trong container, entrypoint truyền --server.port=8080 nên nhánh mặc định này chỉ dùng cho
  # lần chạy trực tiếp trên máy dev không có APP_PORT.
  port: ${APP_PORT:8080}

spring:
  # Nạp .env ở thư mục chạy app theo định dạng properties. `optional:` để app vẫn khởi động được
  # khi biến môi trường đã được cung cấp từ bên ngoài (docker, CI) mà không có file .env.
  config:
    import: optional:file:.env[.properties]

  application:
    name: lopet
  profiles:
    default: dev

  # MYSQL on RAILWAY
  datasource:
    url: jdbc:mysql://${DATABASE_HOSTNAME}:${DATABASE_PORT}/${DATABASE_NAME}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # TypeORM chạy synchronize:true nên schema do entity sinh ra; update giữ nguyên cách đó.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        default_batch_fetch_size: 32
    hibernate:
      # Đặt `update` để Hibernate tự sinh hai bảng mới `pets` và `pet_ownerships` — dự án không dùng
      # Flyway/Liquibase nên không có đường nào khác để tạo bảng ngoài DDL thủ công.
      # Lưu ý: giá trị này áp cho TOÀN BỘ entity, không riêng hai bảng mới.
      ddl-auto: update
      naming:
        # BẮT BUỘC. Mặc định của Spring Boot (CamelCaseToUnderscoresNamingStrategy) đổi cả tên cột
        # đã khai tường minh: `createdAt` -> `created_at`, `receptorId` -> `receptor_id`. Schema do
        # TypeORM sinh ra giữ nguyên camelCase, nên để mặc định là tạo ra một bộ cột song song và
        # khoá ngoại trỏ vào cột không tồn tại.
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    # Tắt open-in-view: mọi ánh xạ entity -> DTO phải nằm trong service, còn transaction.
    open-in-view: false


  data:
    redis:
      url: ${REDIS_URL}
      host: ${REDIS_HOSTNAME}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE}
      max-request-size: ${MAX_REQUEST_SIZE}

lopet:
  jwt:
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    access-token-expires-in: ${ACCESS_TOKEN_EXPIRES_IN}
    refresh-token-expires-in: ${REFRESH_TOKEN_EXPIRES_IN}

  cors:
    # corsMiddleware của TS mở '*' bất kể DOMAIN_CORS, giữ nguyên mặc định đó.
    allowed-origins: ${DOMAIN_CORS}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  # Mail đi qua HTTP API của Resend, không còn SMTP nên không còn khối `spring.mail`.
  mail:
    # Phải thuộc domain đã verify trong dashboard Resend. Dạng "Tên hiển thị <địa-chỉ@domain>".
    from: ${MAIL_FROM}
    admin-receiver: ${MAIL_ADMIN_RECEIVER}
    resend:
      api-key: ${RESEND_API_KEY}

  admin:
    email: ${INIT_ADMIN_EMAIL}
    username: ${INIT_ADMIN_USERNAME}
    password: ${INIT_ADMIN_PASSWORD}

  socket:
    # netty-socketio phải nghe cổng riêng vì Tomcat đã chiếm ${APP_PORT}.
    # Xem docs/MIGRATION_FINAL_REPORT.md — đây là khác biệt cần client đổi URL socket.
    #
    # Khi chạy bằng Docker thì không còn khác biệt đó: docker/entrypoint.sh truyền thẳng
    # --lopet.socket.hostname/--lopet.socket.port, và nginx gộp cả hai cổng về một origin
    # duy nhất, client dùng lại đúng URL của REST API.
    hostname: ${SOCKET_HOSTNAME:0.0.0.0}
    port: ${SOCKET_PORT:8081}

logging:
  level:
    root: ${LOG_LEVEL}
    com.nguyenvu.lopet: ${LOG_LEVEL}
