server:
  port: ${APP_PORT:8080}

spring:
  rabbitmq:
    host: ${RABBIT_MQ_HOST}
    port: ${RABBIT_MQ_PORT}
    username: ${RABBIT_MQ_USERNAME}
    password: ${RABBIT_MQ_PASSWORD}
    virtual-host: ${RABBIT_MQ_VHOST}
    ssl:
      enabled: true

  application:
    name: lopet

  profiles:
    default: dev

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${DATABASE_HOSTNAME}:${DATABASE_PORT}/${DATABASE_NAME}?useUnicode=true&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

  data:
    redis:
      host: ${REDIS_HOSTNAME:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      max-request-size: ${MAX_REQUEST_SIZE:500MB}

lopet:
  jwt:
    access-token-secret: ${ACCESS_TOKEN_SECRET}
    refresh-token-secret: ${REFRESH_TOKEN_SECRET}
    access-token-expires-in: ${ACCESS_TOKEN_EXPIRES_IN:3600}
    refresh-token-expires-in: ${REFRESH_TOKEN_EXPIRES_IN:36000}

  auth:
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:refreshToken}
      path: ${REFRESH_COOKIE_PATH:/}
      secure: ${REFRESH_COOKIE_SECURE:false}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

  cors:
    allowed-origins: ${DOMAIN_CORS:*}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

  mail:
    from: ${MAIL_FROM}
    admin-receiver: ${MAIL_ADMIN_RECEIVER}
    resend:
      api-key: ${RESEND_API_KEY}

  admin:
    email: ${INIT_ADMIN_EMAIL:}
    username: ${INIT_ADMIN_USERNAME:}
    password: ${INIT_ADMIN_PASSWORD:}

  bootstrap:
    seed-demo: false

management:
  endpoints:
    web:
      exposure:
        include: health