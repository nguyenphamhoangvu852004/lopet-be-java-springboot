server {
    listen 80;
    server_name api.nguyenvu.io.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.nguyenvu.io.vn;

    ssl_certificate     /etc/letsencrypt/live/api.nguyenvu.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.nguyenvu.io.vn/privkey.pem;

     location /socket.io/ {
        proxy_pass http://backend:8081;   # thay đúng port thật đã xác nhận ở trên
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;   # WebSocket là long-lived connection, timeout mặc định 60s sẽ cắt ngang
    }

    location / {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
